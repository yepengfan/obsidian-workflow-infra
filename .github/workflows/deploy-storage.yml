name: plan and apply
on:
  workflow_run:
    workflows: [validate]
    branches: [main]
    types: [completed]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
concurrency:
  group: obsidian-storage-production
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      arn: ${{ steps.plan.outputs.arn }}
      operation: ${{ steps.operation.outputs.operation }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject an outdated or mismatched verified revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]]
      - name: Require native approval protection before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > production-environment.json
          if ! jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" \
            'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .type == "User" and .reviewer.login == $owner))' production-environment.json; then
            echo 'Configure the repository owner as a production Required reviewer before AWS authentication.' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run synth
      - name: Read versioned AWS settings
        id: config
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const s = require('./config/storage.json');
          const g = require('./config/github.json');
          console.log('account=' + s.account);
          console.log('region=' + s.region);
          console.log('executionRole=arn:aws:iam::' + s.account + ':role/' + g.executionRoleName);
          console.log('roleArn=arn:aws:iam::' + s.account + ':role/' + g.planRoleName);
          NODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.roleArn }}
          aws-region: ${{ steps.config.outputs.region }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
      - name: Select import or update from actual stack state
        id: operation
        run: |
          if aws cloudformation describe-stacks --stack-name ObsidianWorkflowStorage > stack.json 2> stack-error.txt; then
            status=$(jq -r '.Stacks[0].StackStatus' stack.json)
            case "$status" in
              REVIEW_IN_PROGRESS) operation=import ;;
              IMPORT_COMPLETE|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                aws cloudformation describe-stack-resources --stack-name ObsidianWorkflowStorage > stack-resources.json
                jq -e --slurpfile expected config/import-resources.json \
                  '[.StackResources[] | select(.ResourceType == "AWS::S3::Bucket") | {LogicalResourceId, ResourceType, ResourceIdentifier: {BucketName: .PhysicalResourceId}}] | sort_by(.LogicalResourceId) == ($expected[0] | sort_by(.LogicalResourceId))' stack-resources.json
                operation=update ;;
              *) echo "Unsupported stack state: $status. Inspect AWS before retrying." >&2; exit 1 ;;
            esac
          else
            error=$(cat stack-error.txt)
            if [[ "$error" == *'(ValidationError)'* && "$error" == *'Stack with id ObsidianWorkflowStorage does not exist'* ]]; then
              operation=import
            else
              cat stack-error.txt >&2
              exit 1
            fi
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
      - name: Create and summarize the unexecuted native plan
        id: plan
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          EXECUTION_ROLE: ${{ steps.config.outputs.executionRole }}
          ACCOUNT: ${{ steps.config.outputs.account }}
          REGION: ${{ steps.config.outputs.region }}
        run: |
          args=()
          case "$OPERATION" in
            import) type=IMPORT; args+=(--resources-to-import file://config/import-resources.json) ;;
            update) type=UPDATE ;;
            *) exit 1 ;;
          esac
          name="obsidian-storage-${OPERATION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          description="repo=${GITHUB_REPOSITORY_ID} sha=${SOURCE_SHA} operation=${OPERATION}"
          arn=$(aws cloudformation create-change-set \
            --stack-name ObsidianWorkflowStorage --change-set-name "$name" \
            --change-set-type "$type" --description "$description" \
            --template-body file://cdk.out/ObsidianWorkflowStorage.template.json \
            --role-arn "$EXECUTION_ROLE" --resource-types AWS::S3::Bucket AWS::S3::BucketPolicy \
            "${args[@]}" --query Id --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          has_changes=true
          if ! aws cloudformation wait change-set-create-complete --change-set-name "$arn"; then
            aws cloudformation describe-change-set --change-set-name "$arn" > change-set.json
            if [[ "$OPERATION" == update ]] && jq -e '.Status == "FAILED" and ((.StatusReason | startswith("The submitted information didn\u0027t contain changes.")) or (.StatusReason | startswith("No updates are to be performed")))' change-set.json; then
              has_changes=false
            else
              cat change-set.json >&2
              exit 1
            fi
          else
            aws cloudformation describe-change-set --change-set-name "$arn" > change-set.json
          fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          {
            echo "## Storage plan: ${OPERATION}"
            echo
            echo "Account: ${ACCOUNT} | Region: ${REGION} | Stack: ObsidianWorkflowStorage"
            echo
            echo "Verified commit: ${SOURCE_SHA}"
            echo
            echo "Change set: ${arn}"
            echo
            echo '| Action | Logical resource | Type | Replacement |'
            echo '| --- | --- | --- | --- |'
            jq -r '.Changes[]?.ResourceChange | "| \(.Action) | \(.LogicalResourceId) | \(.ResourceType) | \(.Replacement // "n/a") |"' change-set.json
            echo
            if [[ "$has_changes" == true ]]; then
              echo 'Review this unexecuted plan and its artifact, then approve the production deployment in this run. Apply executes this exact ARN without resynthesizing.'
            else
              echo 'No resource changes. Apply is skipped and no deployment approval is requested.'
            fi
            echo
            echo '### Original bucket import mapping'
            echo '| Logical resource | Existing bucket |'
            echo '| --- | --- |'
            jq -r '.[] | "| \(.LogicalResourceId) | \(.ResourceIdentifier.BucketName) |"' config/import-resources.json
            echo
            echo 'Plan creates CloudFormation metadata; it does not execute the change set or modify note objects.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-change-set-${{ github.event.workflow_run.head_sha }}
          retention-days: 7
          path: |
            change-set.json
            cdk.out/ObsidianWorkflowStorage.template.json
            config/import-resources.json
  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require native approval protection before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > production-environment.json
          if ! jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" \
            'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .type == "User" and .reviewer.login == $owner))' production-environment.json; then
            echo 'Configure the repository owner as a production Required reviewer before AWS authentication.' >&2
            exit 1
          fi
      - name: Read versioned AWS settings
        id: config
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const s = require('./config/storage.json');
          const g = require('./config/github.json');
          console.log('account=' + s.account);
          console.log('region=' + s.region);
          console.log('roleArn=arn:aws:iam::' + s.account + ':role/' + g.deployRoleName);
          NODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.roleArn }}
          aws-region: ${{ steps.config.outputs.region }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
      - name: Inspect the exact reviewed plan and reject stale or destructive actions
        env:
          CHANGE_SET_ARN: ${{ needs.plan.outputs.arn }}
          OPERATION: ${{ needs.plan.outputs.operation }}
          EXPECTED_ACCOUNT: ${{ steps.config.outputs.account }}
          EXPECTED_REGION: ${{ steps.config.outputs.region }}
        run: |
          [[ "$CHANGE_SET_ARN" == "arn:aws:cloudformation:${EXPECTED_REGION}:${EXPECTED_ACCOUNT}:changeSet/obsidian-storage-${OPERATION}-"* ]]
          aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" > reviewed-plan.json
          expected="repo=${GITHUB_REPOSITORY_ID} sha=${SOURCE_SHA} operation=${OPERATION}"
          jq -e --arg description "$expected" \
            --arg stack "arn:aws:cloudformation:${EXPECTED_REGION}:${EXPECTED_ACCOUNT}:stack/ObsidianWorkflowStorage/" \
            '.Status == "CREATE_COMPLETE" and .ExecutionStatus == "AVAILABLE" and .Description == $description and (.StackId | startswith($stack))' reviewed-plan.json
          if [[ "$OPERATION" == import ]]; then
            jq -e '[.Changes[].ResourceChange] | length == 2 and all(.Action == "Import" and .ResourceType == "AWS::S3::Bucket") and ([.[].LogicalResourceId] | sort == ["Library","Vault"])' reviewed-plan.json
          elif [[ "$OPERATION" == update ]]; then
            jq -e '[.Changes[].ResourceChange] | length > 0 and all((.ResourceType == "AWS::S3::Bucket" or .ResourceType == "AWS::S3::BucketPolicy") and (.Action == "Modify" or (.Action == "Add" and .ResourceType == "AWS::S3::BucketPolicy")) and (.Replacement == null or .Replacement == "False"))' reviewed-plan.json
          else
            exit 1
          fi
          jq '{Description, Changes}' reviewed-plan.json
      - name: Execute that existing change set without resynthesizing
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_SET_ARN: ${{ needs.plan.outputs.arn }}
          OPERATION: ${{ needs.plan.outputs.operation }}
        run: |
          live_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$live_main_sha" != "$SOURCE_SHA" ]]; then
            echo 'Main advanced since this workflow revision. Review a fresh plan on current main.' >&2
            exit 1
          fi
          aws cloudformation execute-change-set --change-set-name "$CHANGE_SET_ARN"
          if [[ "$OPERATION" == import ]]; then
            aws cloudformation wait stack-import-complete --stack-name ObsidianWorkflowStorage
          else
            aws cloudformation wait stack-update-complete --stack-name ObsidianWorkflowStorage
          fi
          aws cloudformation update-termination-protection --enable-termination-protection --stack-name ObsidianWorkflowStorage
          aws cloudformation describe-stack-resources --stack-name ObsidianWorkflowStorage
      - name: Verify modeled resource drift without writing objects
        run: |
          detection=$(aws cloudformation detect-stack-drift --stack-name ObsidianWorkflowStorage --query StackDriftDetectionId --output text)
          for _ in {1..30}; do
            aws cloudformation describe-stack-drift-detection-status --stack-drift-detection-id "$detection" > drift.json
            status=$(jq -r '.DetectionStatus' drift.json)
            case "$status" in
              DETECTION_COMPLETE)
                jq -e '.StackDriftStatus == "IN_SYNC"' drift.json
                echo 'Reviewed change set executed; modeled resources are IN_SYNC. Confirm read-only client access / sync preview before declaring adoption complete.' >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              DETECTION_FAILED) cat drift.json; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Drift detection did not finish in this bounded check. Inspect AWS status; do not re-import blindly.' >&2
          exit 1

  plan-cognito:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      arn: ${{ steps.plan.outputs.arn }}
      operation: ${{ steps.operation.outputs.operation }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject an outdated or mismatched verified revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]]
      - name: Require native approval protection before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > production-environment.json
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" \
            'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .type == "User" and .reviewer.login == $owner))' production-environment.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run synth:cognito
      - name: Read versioned AWS settings
        id: config
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const s = require('./config/storage.json');
          const g = require('./config/github.json');
          console.log('account=' + s.account);
          console.log('region=' + s.region);
          console.log('executionRole=arn:aws:iam::' + s.account + ':role/' + g.mcpExecutionRoleName);
          console.log('roleArn=arn:aws:iam::' + s.account + ':role/' + g.planRoleName);
          NODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.roleArn }}
          aws-region: ${{ steps.config.outputs.region }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
      - name: Select Cognito create or update from actual stack state
        id: operation
        run: |
          if aws cloudformation describe-stacks --stack-name ObsidianMcp > cognito-stack.json 2> cognito-stack-error.txt; then
            status=$(jq -r '.Stacks[0].StackStatus' cognito-stack.json)
            case "$status" in
              REVIEW_IN_PROGRESS) operation=create ;;
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                aws cloudformation describe-stack-resources --stack-name ObsidianMcp > cognito-resources.json
                jq -e '[.StackResources[] | {LogicalResourceId, ResourceType}] | sort_by(.LogicalResourceId) == [{LogicalResourceId:"UserPool", ResourceType:"AWS::Cognito::UserPool"}, {LogicalResourceId:"UserPoolDomain", ResourceType:"AWS::Cognito::UserPoolDomain"}]' cognito-resources.json
                operation=update ;;
              *) echo "Unsupported Cognito stack state: $status. Inspect AWS before retrying." >&2; exit 1 ;;
            esac
          else
            error=$(cat cognito-stack-error.txt)
            if [[ "$error" == *'(ValidationError)'* && "$error" == *'Stack with id ObsidianMcp does not exist'* ]]; then
              operation=create
            else
              cat cognito-stack-error.txt >&2
              exit 1
            fi
          fi
          if [[ "$operation" == create ]]; then
            node --input-type=commonjs -e 'if (require("./config/github.json").mcpUserPoolId) { console.error("Pinned pool stack is absent; inspect retained resources instead of creating replacements."); process.exit(1); }'
          else
            node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const expected = require('./config/github.json').mcpUserPoolId;
          const resources = JSON.parse(fs.readFileSync('cognito-resources.json', 'utf8')).StackResources;
          if (expected && resources.find(r => r.LogicalResourceId === 'UserPool').PhysicalResourceId !== expected) process.exit(1);
          NODE
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
      - name: Create and summarize the unexecuted Cognito plan
        id: plan
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          EXECUTION_ROLE: ${{ steps.config.outputs.executionRole }}
          ACCOUNT: ${{ steps.config.outputs.account }}
          REGION: ${{ steps.config.outputs.region }}
        run: |
          case "$OPERATION" in create) type=CREATE ;; update) type=UPDATE ;; *) exit 1 ;; esac
          name="obsidian-mcp-${OPERATION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          description="repo=${GITHUB_REPOSITORY_ID} sha=${SOURCE_SHA} operation=${OPERATION}"
          arn=$(aws cloudformation create-change-set \
            --stack-name ObsidianMcp --change-set-name "$name" \
            --change-set-type "$type" --description "$description" \
            --template-body file://cdk.cognito.out/ObsidianMcp.template.json \
            --role-arn "$EXECUTION_ROLE" --resource-types AWS::Cognito::UserPool AWS::Cognito::UserPoolDomain \
            --query Id --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          has_changes=true
          if ! aws cloudformation wait change-set-create-complete --change-set-name "$arn"; then
            aws cloudformation describe-change-set --change-set-name "$arn" > cognito-change-set.json
            if [[ "$OPERATION" == update ]] && jq -e '.Status == "FAILED" and ((.StatusReason | startswith("The submitted information didn\u0027t contain changes.")) or (.StatusReason | startswith("No updates are to be performed")))' cognito-change-set.json; then
              has_changes=false
            else
              cat cognito-change-set.json >&2
              exit 1
            fi
          else
            aws cloudformation describe-change-set --change-set-name "$arn" > cognito-change-set.json
          fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          {
            echo "## Cognito plan: ${OPERATION}"
            echo
            echo "Account: ${ACCOUNT} | Region: ${REGION} | Stack: ObsidianMcp"
            echo
            echo "Verified commit: ${SOURCE_SHA}"
            echo
            echo "Change set: ${arn}"
            echo
            echo '| Action | Logical resource | Type | Replacement |'
            echo '| --- | --- | --- | --- |'
            jq -r '.Changes[]?.ResourceChange | "| \(.Action) | \(.LogicalResourceId) | \(.ResourceType) | \(.Replacement // "n/a") |"' cognito-change-set.json
            echo
            if [[ "$has_changes" == true ]]; then
              echo 'Review the plan and template artifact before native production approval. Apply executes this exact ARN. The retained pool disables public signup, requires TOTP MFA and enables deletion protection. The domain uses managed login v2.'
            else
              echo 'No resource changes. Apply is skipped; live discovery is checked in Plan.'
            fi
            echo
            echo 'Compatibility probe only: no users, clients, registration, tokens, MCP endpoint or note access. A successful CloudFormation deployment is not proof of ChatGPT compatibility; live discovery must advertise S256. Pool-ID pinning requires a separate reviewed IAM update.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check discovery for an unchanged Cognito stack
        if: steps.plan.outputs.has_changes == 'false'
        run: npm run check:cognito -- cognito-stack.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cognito-change-set-${{ github.event.workflow_run.head_sha }}
          retention-days: 7
          path: |
            cognito-change-set.json
            cdk.cognito.out/ObsidianMcp.template.json
  apply-cognito:
    needs: plan-cognito
    if: needs.plan-cognito.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject an outdated or mismatched verified revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]]
      - name: Require native approval protection before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > production-environment.json
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" \
            'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .type == "User" and .reviewer.login == $owner))' production-environment.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read versioned AWS settings
        id: config
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const s = require('./config/storage.json');
          const g = require('./config/github.json');
          console.log('account=' + s.account);
          console.log('region=' + s.region);
          console.log('roleArn=arn:aws:iam::' + s.account + ':role/' + g.deployRoleName);
          NODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.roleArn }}
          aws-region: ${{ steps.config.outputs.region }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
      - name: Inspect the exact reviewed Cognito plan
        env:
          CHANGE_SET_ARN: ${{ needs.plan-cognito.outputs.arn }}
          OPERATION: ${{ needs.plan-cognito.outputs.operation }}
          EXPECTED_ACCOUNT: ${{ steps.config.outputs.account }}
          EXPECTED_REGION: ${{ steps.config.outputs.region }}
        run: |
          [[ "$CHANGE_SET_ARN" == "arn:aws:cloudformation:${EXPECTED_REGION}:${EXPECTED_ACCOUNT}:changeSet/obsidian-mcp-${OPERATION}-"* ]]
          aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" > reviewed-cognito-plan.json
          expected="repo=${GITHUB_REPOSITORY_ID} sha=${SOURCE_SHA} operation=${OPERATION}"
          jq -e --arg description "$expected" \
            --arg stack "arn:aws:cloudformation:${EXPECTED_REGION}:${EXPECTED_ACCOUNT}:stack/ObsidianMcp/" \
            '.Status == "CREATE_COMPLETE" and .ExecutionStatus == "AVAILABLE" and .Description == $description and (.StackId | startswith($stack))' reviewed-cognito-plan.json
          jq -e '[.Changes[].ResourceChange] | length > 0 and all(((.LogicalResourceId == "UserPool" and .ResourceType == "AWS::Cognito::UserPool") or (.LogicalResourceId == "UserPoolDomain" and .ResourceType == "AWS::Cognito::UserPoolDomain")) and (.Replacement == null or .Replacement == "False"))' reviewed-cognito-plan.json
          case "$OPERATION" in
            create) jq -e '[.Changes[].ResourceChange] | length == 2 and all(.Action == "Add") and ([.[].LogicalResourceId] | sort == ["UserPool", "UserPoolDomain"])' reviewed-cognito-plan.json ;;
            update) jq -e '[.Changes[].ResourceChange] | all(.Action == "Modify")' reviewed-cognito-plan.json ;;
            *) exit 1 ;;
          esac
          jq '{Description, Changes}' reviewed-cognito-plan.json
      - name: Execute the reviewed Cognito change set
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_SET_ARN: ${{ needs.plan-cognito.outputs.arn }}
          OPERATION: ${{ needs.plan-cognito.outputs.operation }}
        run: |
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]]
          case "$OPERATION" in create) waiter=stack-create-complete ;; update) waiter=stack-update-complete ;; *) exit 1 ;; esac
          aws cloudformation update-termination-protection --enable-termination-protection --stack-name ObsidianMcp
          aws cloudformation execute-change-set --change-set-name "$CHANGE_SET_ARN"
          aws cloudformation wait "$waiter" --stack-name ObsidianMcp
          aws cloudformation describe-stacks --stack-name ObsidianMcp > cognito-stack.json
          jq -e '.Stacks[0].EnableTerminationProtection == true' cognito-stack.json
          echo 'Cognito change set executed. Resources exist even if the following compatibility check fails. Inspect AWS before retrying; never recreate or delete retained identity resources as an automatic recovery.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check actual OAuth discovery with bounded propagation retries
        run: |
          for attempt in {1..6}; do
            if npm run check:cognito -- cognito-stack.json; then
              echo 'Live discovery passed, including S256. PKCE exchange, audience/resource binding, refresh and a real ChatGPT connection remain unverified. Pin the pool ID through the reviewed IAM/SSO procedure before enabling OAuth or note access.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          echo 'Cognito resources were deployed, but compatibility was NOT established. OAuth and private-note access must remain disabled; do not fake discovery or weaken authentication.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
