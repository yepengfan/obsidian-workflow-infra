name: Review diff and deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to request production approval
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: obsidian-production
  cancel-in-progress: false
jobs:
  diff:
    # Disabled until deployment identity and private-repo approval protection are configured.
    if: vars.ENABLE_AWS_DEPLOY == 'true' && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-24.04
    environment: production-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Write non-secret deployment configuration
        env:
          DEPLOY_CONFIG_JSON: ${{ vars.DEPLOY_CONFIG_JSON }}
        run: |
          node --input-type=commonjs -e 'require("fs").writeFileSync("config/local.json", process.env.DEPLOY_CONFIG_JSON)'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Synthesize and review actual environment diff
        run: |
          npm run synth
          npm run diff 2>&1 | tee cdk-diff.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-cloud-assembly
          path: |
            cdk.out/
            cdk-diff.txt
          retention-days: 3
  deploy:
    needs: diff
    runs-on: ubuntu-24.04
    # Configure required reviewers and main-only deployment branches BEFORE enabling.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-cloud-assembly
          path: reviewed
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy the assembly already reviewed in the diff job
        run: npx --no-install cdk deploy ObsidianS3Mcp --app reviewed/cdk.out --require-approval never --outputs-file cdk-outputs.json
      - name: Verify anonymous access is denied and discovery is public
        run: |
          ENDPOINT=$(node --input-type=commonjs -p 'require("./cdk-outputs.json").ObsidianS3Mcp.McpEndpoint')
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$ENDPOINT")" = 401
          curl --fail --silent "${ENDPOINT%/mcp}/.well-known/oauth-protected-resource/mcp" | jq -e --arg endpoint "$ENDPOINT" '.resource == $endpoint'
      - name: Check the newly available Cognito discovery metadata
        run: npm run check:oauth
