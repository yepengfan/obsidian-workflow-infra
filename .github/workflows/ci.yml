name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate workflow definitions with the pinned native linter
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit build dependencies (known CDK bundled moderate finding documented)
        run: npm audit --audit-level=high
      - name: Synthesize the entire infrastructure without AWS credentials
        run: npm run synth
      - name: Publish the offline infrastructure preview in the run summary
        env:
          NO_COLOR: '1'
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          mkdir -p cdk.review.out
          node --input-type=module <<'NODE' > cdk.review.out/stacks.txt
          import fs from 'node:fs';
          const { artifacts } = JSON.parse(fs.readFileSync('cdk.out/manifest.json', 'utf8'));
          for (const [id, artifact] of Object.entries(artifacts)) {
            if (artifact.type === 'aws:cloudformation:stack') console.log(id);
          }
          NODE
          while IFS= read -r stack; do
            npx --no-install cdk diff "$stack" --app cdk.out --template config/empty-template.json --no-lookups >> cdk.review.out/infrastructure.diff.txt 2>&1
          done < cdk.review.out/stacks.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const escape = text => text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
          let summary = '## Offline infrastructure preview\n\nCommit: ' + process.env.GITHUB_SHA + '\n\n';
          const stage = JSON.parse(fs.readFileSync('cdk.out/ObsidianMcp.template.json', 'utf8')).Metadata.McpDeploymentStage;
          summary += '**MCP rollout stage:** ' + stage + '. Advance config/mcp-deployment.json only after the previous stage is deployed; IAM remains a separately approved local SSO update.\n\n';
          summary += 'These definitions are compared with the empty baseline in config/empty-template.json. This offline preview is not a live AWS change set or a PR-base diff. Storage first adoption uses IMPORT and later changes use UPDATE. The existing MCP stack uses UPDATE; an absent identity stack stops deployment. Existing note buckets must never be recreated. The deployment Plan selects the actual operation from live stack state. No AWS credentials are used.\n\n';
          summary += '**Permission foundation:** no standard CDK bootstrap or administrator execution role. Review the named Plan / Deploy roles and dedicated storage and Cognito execution roles in the IAM diff. No AWS repository variables or static keys are required. Apply permission changes from a reviewed revision via local SSO before CI deploys resources needing them.\n\n';
          summary += '<details><summary>Entire infrastructure</summary><pre>' + escape(fs.readFileSync('cdk.review.out/infrastructure.diff.txt', 'utf8')) + '</pre></details>\n\n';
          summary += 'After the AWS foundation is configured, successful validate pushes on main automatically start plan and apply: Plan, production approval, then Apply of the exact source-bound infrastructure change sets.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudformation-review
          retention-days: 7
          path: |
            cdk.out/*.template.json
            cdk.out/CodeBundle.json
            config/import-resources.json
            cdk.review.out/
